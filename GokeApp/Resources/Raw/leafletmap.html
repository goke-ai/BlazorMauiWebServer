<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Leaflet Map in .NET MAUI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          crossorigin=""
          referrerpolicy="strict-origin-when-cross-origin" />

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            crossorigin=""
            referrerpolicy="strict-origin-when-cross-origin"></script>

    <script>
        const forecasts = __FORECASTS_JSON__;
        const map = L.map("map");
        const bounds = [];

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        for (const forecast of forecasts) {
            const latLng = [forecast.latitude, forecast.longitude];
            bounds.push(latLng);

            L.marker(latLng)
                .addTo(map)
                .bindPopup(
                    `<strong>${forecast.city}</strong><br/>
                     Temperature: ${forecast.temperatureC}&deg;C<br/>
                     Summary: ${forecast.summary ?? ""}<br/>
                     Time: ${forecast.date}`);
        }

        if (bounds.length === 0) {
            map.setView([20, 0], 2);
        } else if (bounds.length === 1) {
            map.setView(bounds[0], 6);
        } else {
            map.fitBounds(bounds, { padding: [30, 30] });
        }
    </script>
</body>
</html>
